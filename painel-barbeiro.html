<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Barbeiro</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .topbar h1 { font-size: 20px; }
    .topbar .logo { font-size: 24px; }
    .main-tabs { display: flex; gap: 8px; background: #1a1a1a; padding: 6px; border-radius: 14px; margin-bottom: 24px; }
    .main-tab { flex: 1; padding: 12px; border-radius: 10px; border: none; background: transparent; color: #888; cursor: pointer; font-size: 15px; font-weight: 600; }
    .main-tab.active { background: #4ade80; color: #000; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
    .stat { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px; padding: 16px 12px; text-align: center; }
    .stat .num { font-size: 24px; font-weight: 700; }
    .stat .label { font-size: 11px; color: #888; margin-top: 4px; text-transform: uppercase; }
    .stat.money .num { color: #4ade80; }
    .day-tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 6px; }
    .day-tab { flex: 0 0 auto; padding: 10px 16px; border-radius: 10px; border: 1px solid #333; background: #1a1a1a; color: #fff; cursor: pointer; font-size: 14px; white-space: nowrap; }
    .day-tab.active { background: #4ade80; color: #000; border-color: #4ade80; font-weight: 600; }
    .appointment { display: flex; align-items: center; gap: 14px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .appointment.done { opacity: 0.5; }
    .appointment.cancelled { opacity: 0.4; }
    .appointment.cancelled .info b { text-decoration: line-through; }
    .time-badge { flex: 0 0 auto; width: 56px; text-align: center; background: #0f0f0f; border-radius: 10px; padding: 10px 6px; }
    .time-badge .hour { font-size: 18px; font-weight: 700; }
    .time-badge .period { font-size: 10px; color: #888; }
    .info { flex: 1; min-width: 0; }
    .info b { font-size: 16px; display: block; }
    .info .service-line { color: #4ade80; font-size: 13px; margin-top: 2px; }
    .info .phone { color: #888; font-size: 13px; margin-top: 2px; }
    .actions { display: flex; flex-direction: column; gap: 6px; }
    .action-btn { border: none; border-radius: 8px; padding: 8px 10px; font-size: 12px; cursor: pointer; font-weight: 600; white-space: nowrap; text-decoration: none; text-align: center; display: block; }
    .btn-done { background: #14351f; color: #4ade80; }
    .btn-cancel { background: #3a1515; color: #f87171; }
    .btn-wa { background: #0f2f1a; color: #25d366; }
    .status-tag { font-size: 11px; padding: 4px 8px; border-radius: 6px; font-weight: 600; }
    .tag-done { background: #14351f; color: #4ade80; }
    .tag-cancelled { background: #3a1515; color: #f87171; }
    .empty { text-align: center; color: #666; padding: 40px 20px; background: #1a1a1a; border-radius: 14px; }
    .section-label { color: #888; font-size: 13px; margin: 8px 0 12px; font-weight: 600; }
    .loading { text-align: center; color: #888; padding: 40px; }
    .panel { background: #141414; border: 1px solid #2a2a2a; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .panel-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .panel-sub { color: #888; font-size: 13px; margin-bottom: 16px; }
    .form-row { margin-bottom: 12px; }
    .form-row label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 15px; }
    input:focus { outline: none; border-color: #4ade80; }
    .price-input { display: flex; align-items: center; gap: 8px; }
    .price-input span { color: #888; font-size: 15px; }
    .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #4ade80; color: #000; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px; }
    .btn:disabled { opacity: 0.6; }
    .svc-item { display: flex; align-items: center; gap: 12px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
    .svc-item.editing { flex-wrap: wrap; }
    .svc-item .svc-info { flex: 1; }
    .svc-item .svc-name { font-size: 15px; font-weight: 600; }
    .svc-item .svc-price { color: #4ade80; font-size: 13px; margin-top: 2px; }
    .svc-item .svc-dur { color: #777; font-size: 12px; }
    .svc-actions { display: flex; gap: 6px; }
    .icon-btn { border: none; background: #2a2a2a; color: #f87171; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 16px; }
    .icon-btn:hover { background: #3a1515; }
    .icon-btn.edit { color: #4ade80; }
    .icon-btn.edit:hover { background: #14351f; }
    .edit-form { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .edit-form input { font-size: 14px; padding: 10px; }
    .edit-form .row { display: flex; gap: 8px; }
    .edit-form .row input { flex: 1; }
    .edit-actions { display: flex; gap: 8px; }
    .btn-save { flex: 1; padding: 10px; border: none; border-radius: 8px; background: #4ade80; color: #000; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn-cancel-edit { flex: 1; padding: 10px; border: 1px solid #333; border-radius: 8px; background: transparent; color: #888; cursor: pointer; font-size: 14px; }
    .preview { background: #0f0f0f; border: 2px dashed #333; border-radius: 16px; padding: 20px; }
    .preview-badge { display: inline-block; background: #14351f; color: #4ade80; font-size: 11px; padding: 4px 10px; border-radius: 20px; margin-bottom: 16px; font-weight: 600; }
    .preview .p-header { text-align: center; margin-bottom: 16px; }
    .preview .p-logo { font-size: 32px; }
    .preview .p-header h2 { font-size: 18px; margin-top: 6px; }
    .preview .service { display: block; width: 100%; text-align: left; padding: 14px; margin-bottom: 8px; border-radius: 12px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 15px; }
    .preview .service .price { float: right; color: #4ade80; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>Barbearia do João</h1>
      <div class="logo">💈</div>
    </div>

    <div class="main-tabs">
      <button class="main-tab active" onclick="trocarAba('agenda', this)">📅 Agendamentos</button>
      <button class="main-tab" onclick="trocarAba('servicos', this)">✂️ Meus Serviços</button>
    </div>

    <div id="tab-agenda" class="tab-content active">
      <div class="stats">
        <div class="stat"><div class="num" id="stat-total">0</div><div class="label">Cortes</div></div>
        <div class="stat"><div class="num" id="stat-done">0</div><div class="label">Feitos</div></div>
        <div class="stat money"><div class="num" id="stat-money">R$0</div><div class="label">Previsto</div></div>
      </div>
      <div class="day-tabs" id="day-tabs"></div>
      <div class="section-label" id="section-label">Agendamentos</div>
      <div id="list"><div class="loading">Carregando agendamentos...</div></div>
    </div>

    <div id="tab-servicos" class="tab-content">
      <div class="panel">
        <div class="panel-title">Adicionar serviço</div>
        <div class="panel-sub">O que você cadastrar aqui aparece pro cliente na hora de agendar.</div>
        <div class="form-row"><label>Nome do serviço</label><input id="svc-name" type="text" placeholder="Ex: Corte + Barba + Progressiva"></div>
        <div class="form-row"><label>Preço</label><div class="price-input"><span>R$</span><input id="svc-price" type="number" placeholder="60" min="0" step="1"></div></div>
        <div class="form-row"><label>Duração (minutos)</label><input id="svc-dur" type="number" placeholder="30" min="5" step="5"></div>
        <button class="btn" id="add-btn" onclick="adicionarServico()">+ Adicionar serviço</button>
      </div>
      <div class="panel">
        <div class="panel-title">Serviços cadastrados</div>
        <div class="panel-sub">Toque no ✎ para editar ou ✕ para remover.</div>
        <div id="lista-barbeiro"><div class="loading">Carregando...</div></div>
      </div>
      <div class="preview">
        <div class="preview-badge">👁 Como o cliente vê</div>
        <div class="p-header"><div class="p-logo">💈</div><h2>Barbearia do João</h2></div>
        <div id="lista-cliente"></div>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // ⚙️ CONFIGURAÇÃO DO SUPABASE
    // Troque os dois valores abaixo pelos seus.
    // (Os MESMOS que você colocou na página do cliente)
    // ============================================
    const SUPABASE_URL = 'COLE_SUA_URL_AQUI';
    const SUPABASE_ANON_KEY = 'COLE_SUA_CHAVE_ANON_AQUI';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let servicos = [];
    let agendamentos = [];
    let editandoId = null;

    function hojeMais(n) {
      const d = new Date();
      d.setDate(d.getDate() + n);
      const ano = d.getFullYear();
      const mes = String(d.getMonth() + 1).padStart(2, '0');
      const dia = String(d.getDate()).padStart(2, '0');
      return ano + '-' + mes + '-' + dia;
    }
    const SEMANA = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
    let diaAtivo = hojeMais(0);

    function trocarAba(aba, btn) {
      document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById('tab-' + aba).classList.add('active');
    }

    async function carregarAgendamentos() {
      const { data, error } = await supabase.from('appointments').select('*').order('dia').order('hora');
      if (error) {
        document.getElementById('list').innerHTML = '<div class="empty">Erro ao carregar. Verifique a configuração do Supabase.</div>';
        return;
      }
      agendamentos = (data || []).map(a => ({
        id: a.id, dia: a.dia, hora: a.hora, cliente: a.cliente_nome, telefone: a.cliente_telefone,
        servico: a.servico_nome, preco: Number(a.servico_preco), status: a.status
      }));
      renderAgenda();
    }

    async function carregarServicos() {
      const { data, error } = await supabase.from('services').select('*').order('id');
      if (error) return;
      servicos = (data || []).map(s => ({ id: s.id, nome: s.nome, preco: Number(s.preco), duracao: s.duracao_minutos }));
      renderServicos();
    }

    function montarAbas() {
      const container = document.getElementById('day-tabs');
      container.innerHTML = '';
      let dias = [...new Set(agendamentos.map(a => a.dia))].sort();
      if (!dias.includes(hojeMais(0))) dias.unshift(hojeMais(0));
      dias.forEach(dia => {
        const d = new Date(dia + 'T12:00:00');
        let rotulo;
        if (dia === hojeMais(0)) rotulo = 'Hoje';
        else if (dia === hojeMais(1)) rotulo = 'Amanhã';
        else rotulo = SEMANA[d.getDay()].slice(0,3) + ' ' + d.getDate();
        const tab = document.createElement('button');
        tab.className = 'day-tab' + (dia === diaAtivo ? ' active' : '');
        tab.textContent = rotulo;
        tab.onclick = () => { diaAtivo = dia; renderAgenda(); };
        container.appendChild(tab);
      });
    }

    function linkWhats(telefone, cliente, servico, dia, hora) {
      const [ano, mes, d] = dia.split('-');
      const msg = 'Olá ' + cliente + '! Confirmando seu ' + servico + ' no dia ' + d + '/' + mes + ' às ' + hora + '. Até lá! 💈';
      return 'https://wa.me/55' + telefone.replace(/\D/g, '') + '?text=' + encodeURIComponent(msg);
    }

    async function marcarFeito(id) {
      await supabase.from('appointments').update({ status: 'done' }).eq('id', id);
      const a = agendamentos.find(x => x.id === id);
      if (a) a.status = 'done';
      renderAgenda();
    }

    async function cancelar(id) {
      const a = agendamentos.find(x => x.id === id);
      if (a && confirm('Cancelar o agendamento de ' + a.cliente + '?')) {
        await supabase.from('appointments').update({ status: 'cancelled' }).eq('id', id);
        a.status = 'cancelled';
        renderAgenda();
      }
    }

    function renderAgenda() {
      montarAbas();
      const doDia = agendamentos.filter(a => a.dia === diaAtivo).sort((x, y) => x.hora.localeCompare(y.hora));
      const d = new Date(diaAtivo + 'T12:00:00');
      let titulo = diaAtivo === hojeMais(0) ? 'Hoje' : SEMANA[d.getDay()] + ', ' + d.getDate();
      document.getElementById('section-label').textContent = titulo;

      const ativos = doDia.filter(a => a.status !== 'cancelled');
      const feitos = doDia.filter(a => a.status === 'done');
      document.getElementById('stat-total').textContent = ativos.length;
      document.getElementById('stat-done').textContent = feitos.length;
      document.getElementById('stat-money').textContent = 'R$' + ativos.reduce((s, a) => s + a.preco, 0);

      const list = document.getElementById('list');
      if (doDia.length === 0) { list.innerHTML = '<div class="empty">Nenhum agendamento neste dia.</div>'; return; }
      list.innerHTML = '';
      doDia.forEach(a => {
        const [hh] = a.hora.split(':');
        const periodo = parseInt(hh) < 12 ? 'manhã' : (parseInt(hh) < 18 ? 'tarde' : 'noite');
        const div = document.createElement('div');
        div.className = 'appointment ' + (a.status === 'done' ? 'done' : a.status === 'cancelled' ? 'cancelled' : '');
        let actionsHtml;
        if (a.status === 'confirmed') {
          actionsHtml =
            '<a href="' + linkWhats(a.telefone, a.cliente, a.servico, a.dia, a.hora) + '" target="_blank" class="action-btn btn-wa">WhatsApp</a>' +
            '<button class="action-btn btn-done" onclick="marcarFeito(' + a.id + ')">✓ Feito</button>' +
            '<button class="action-btn btn-cancel" onclick="cancelar(' + a.id + ')">Cancelar</button>';
        } else if (a.status === 'done') {
          actionsHtml = '<span class="status-tag tag-done">✓ Feito</span>';
        } else {
          actionsHtml = '<span class="status-tag tag-cancelled">Cancelado</span>';
        }
        div.innerHTML =
          '<div class="time-badge"><div class="hour">' + a.hora + '</div><div class="period">' + periodo + '</div></div>' +
          '<div class="info"><b>' + a.cliente + '</b>' +
            '<div class="service-line">' + a.servico + ' · R$ ' + a.preco + '</div>' +
            '<div class="phone">📱 ' + a.telefone + '</div></div>' +
          '<div class="actions">' + actionsHtml + '</div>';
        list.appendChild(div);
      });
    }

    async function adicionarServico() {
      const nome = document.getElementById('svc-name').value.trim();
      const preco = parseInt(document.getElementById('svc-price').value);
      const dur = parseInt(document.getElementById('svc-dur').value) || 30;
      if (!nome) { alert('Digite o nome do serviço.'); return; }
      if (!preco || preco <= 0) { alert('Digite um preço válido.'); return; }
      const btn = document.getElementById('add-btn');
      btn.disabled = true; btn.textContent = 'Adicionando...';
      const { error } = await supabase.from('services').insert({ nome, preco, duracao_minutos: dur, ativo: true });
      btn.disabled = false; btn.textContent = '+ Adicionar serviço';
      if (error) { alert('Erro ao adicionar.'); return; }
      document.getElementById('svc-name').value = '';
      document.getElementById('svc-price').value = '';
      document.getElementById('svc-dur').value = '';
      await carregarServicos();
    }

    async function removerServico(id) {
      if (!confirm('Remover este serviço?')) return;
      await supabase.from('services').delete().eq('id', id);
      if (editandoId === id) editandoId = null;
      await carregarServicos();
    }

    function iniciarEdicao(id) { editandoId = id; renderServicos(); }
    function cancelarEdicao() { editandoId = null; renderServicos(); }

    async function salvarEdicao(id) {
      const nome = document.getElementById('edit-nome-' + id).value.trim();
      const preco = parseInt(document.getElementById('edit-preco-' + id).value);
      const dur = parseInt(document.getElementById('edit-dur-' + id).value) || 30;
      if (!nome) { alert('Digite o nome.'); return; }
      if (!preco || preco <= 0) { alert('Digite um preço válido.'); return; }
      await supabase.from('services').update({ nome, preco, duracao_minutos: dur }).eq('id', id);
      editandoId = null;
      await carregarServicos();
    }

    function renderServicos() {
      const lb = document.getElementById('lista-barbeiro');
      if (servicos.length === 0) {
        lb.innerHTML = '<div class="empty">Nenhum serviço ainda.</div>';
      } else {
        lb.innerHTML = '';
        servicos.forEach(s => {
          const div = document.createElement('div');
          if (s.id === editandoId) {
            div.className = 'svc-item editing';
            div.innerHTML =
              '<div class="edit-form">' +
                '<input id="edit-nome-' + s.id + '" type="text" value="' + s.nome.replace(/"/g, '&quot;') + '" placeholder="Nome">' +
                '<div class="row">' +
                  '<input id="edit-preco-' + s.id + '" type="number" value="' + s.preco + '" placeholder="Preço">' +
                  '<input id="edit-dur-' + s.id + '" type="number" value="' + s.duracao + '" placeholder="Min">' +
                '</div>' +
                '<div class="edit-actions">' +
                  '<button class="btn-save" onclick="salvarEdicao(' + s.id + ')">Salvar</button>' +
                  '<button class="btn-cancel-edit" onclick="cancelarEdicao()">Cancelar</button>' +
                '</div>' +
              '</div>';
          } else {
            div.className = 'svc-item';
            div.innerHTML =
              '<div class="svc-info"><div class="svc-name">' + s.nome + '</div>' +
                '<div class="svc-price">R$ ' + s.preco + ' <span class="svc-dur">· ' + s.duracao + ' min</span></div></div>' +
              '<div class="svc-actions">' +
                '<button class="icon-btn edit" onclick="iniciarEdicao(' + s.id + ')">✎</button>' +
                '<button class="icon-btn" onclick="removerServico(' + s.id + ')">✕</button>' +
              '</div>';
          }
          lb.appendChild(div);
        });
      }
      const lc = document.getElementById('lista-cliente');
      if (servicos.length === 0) {
        lc.innerHTML = '<div class="empty">Nenhum serviço cadastrado.</div>';
      } else {
        lc.innerHTML = '';
        servicos.forEach(s => {
          const btn = document.createElement('div');
          btn.className = 'service';
          btn.innerHTML = s.nome + ' <span class="price">R$ ' + s.preco + '</span>';
          lc.appendChild(btn);
        });
      }
    }

    carregarAgendamentos();
    carregarServicos();
  </script>
</body>
</html>
