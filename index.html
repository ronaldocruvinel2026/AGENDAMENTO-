<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Corte</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #fff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card { width: 100%; max-width: 440px; }
    .header { text-align: center; margin-bottom: 24px; }
    .header .logo { font-size: 40px; margin-bottom: 8px; }
    .header h1 { font-size: 22px; }
    .header p { color: #888; font-size: 14px; margin-top: 4px; }
    label {
      display: block;
      font-weight: 600;
      margin: 20px 0 10px;
      font-size: 14px;
    }
    .service {
      display: block;
      width: 100%;
      text-align: left;
      padding: 14px;
      margin-bottom: 8px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.15s;
    }
    .service:hover { border-color: #666; }
    .service.selected { border-color: #4ade80; background: #14351f; }
    .service .price { float: right; color: #4ade80; font-weight: 600; }

    .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
    .day {
      flex: 0 0 auto;
      width: 64px;
      padding: 12px 6px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .day:hover { border-color: #666; }
    .day.selected { border-color: #4ade80; background: #14351f; }
    .day .weekday { font-size: 11px; color: #888; text-transform: uppercase; }
    .day.selected .weekday { color: #4ade80; }
    .day .num { font-size: 20px; font-weight: 700; margin-top: 2px; }
    .day .month { font-size: 10px; color: #666; }

    .times { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .time {
      padding: 12px 4px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      cursor: pointer;
      text-align: center;
      font-size: 14px;
      transition: all 0.15s;
    }
    .time:hover { border-color: #666; }
    .time.selected { border-color: #4ade80; background: #14351f; color: #4ade80; font-weight: 600; }
    .time.taken {
      background: #0f0f0f;
      color: #444;
      cursor: not-allowed;
      text-decoration: line-through;
      border-color: #222;
    }
    .empty-msg { color: #666; font-size: 14px; padding: 8px 0; }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 16px;
    }
    input:focus { outline: none; border-color: #666; }
    .btn {
      width: 100%;
      padding: 16px;
      margin-top: 24px;
      border-radius: 12px;
      border: none;
      background: #4ade80;
      color: #000;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn:active { transform: scale(0.98); }
    .success { text-align: center; padding: 40px 20px; }
    .success .check { font-size: 56px; margin-bottom: 16px; }
    .success h2 { margin-bottom: 12px; }
    .success p { color: #aaa; line-height: 1.5; }
    .success .detail {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 16px;
      margin-top: 20px;
      text-align: left;
    }
    .success .detail div { margin: 6px 0; font-size: 14px; }
    .success .detail span { color: #888; }
    .btn-secondary { background: transparent; color: #4ade80; border: 1px solid #333; margin-top: 12px; }
    .error { color: #f87171; font-size: 14px; margin-top: 12px; text-align: center; }
    .loading { color: #888; text-align: center; padding: 40px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">

    <div id="loading-screen" class="loading">Carregando...</div>

    <div id="form-screen" class="hidden">
      <div class="header">
        <div class="logo">💈</div>
        <h1>Barbearia do João</h1>
        <p>Escolha seu horário</p>
      </div>

      <label>1. Serviço</label>
      <div id="services"></div>

      <label>2. Dia</label>
      <div id="days" class="days"></div>

      <label>3. Horário</label>
      <div id="times" class="times">
        <div class="empty-msg">Escolha um dia primeiro.</div>
      </div>

      <label>4. Seus dados</label>
      <input id="name" type="text" placeholder="Seu nome" style="margin-bottom:8px">
      <input id="phone" type="tel" placeholder="(34) 99999-9999">

      <div id="error" class="error hidden"></div>

      <button class="btn" id="submit-btn" onclick="submit()">Confirmar agendamento</button>
    </div>

    <div id="success-screen" class="success hidden">
      <div class="check">✅</div>
      <h2>Agendamento confirmado!</h2>
      <p id="success-msg"></p>
      <div class="detail">
        <div><span>Serviço:</span> <b id="r-service"></b></div>
        <div><span>Nome:</span> <b id="r-name"></b></div>
        <div><span>WhatsApp:</span> <b id="r-phone"></b></div>
        <div><span>Quando:</span> <b id="r-datetime"></b></div>
      </div>
      <button class="btn btn-secondary" onclick="location.reload()">Fazer outro agendamento</button>
    </div>

  </div>

  <script>
    // ============================================
    // ⚙️ CONFIGURAÇÃO DO SUPABASE
    // Troque os dois valores abaixo pelos seus.
    // Pegue em: Supabase -> Settings -> API
    // ============================================
    const SUPABASE_URL = 'https://eaxnvyqriumqrlhqavjz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_x-5YEwSadsYimgtYUI0Xew_52km07Zt';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Configuração de horário (fixa por enquanto)
    const HORARIO_ABERTURA = 9;
    const HORARIO_FECHAMENTO = 19;
    const DIAS_A_MOSTRAR = 7;
    const TRABALHA_DOMINGO = false;

    let selected = { service: null, price: null, day: null, time: null };
    let ocupados = []; // preenchido do banco

    const SEMANA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
    const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

    // Carrega serviços e agendamentos ocupados do banco
    async function iniciar() {
      try {
        // Busca serviços ativos
        const { data: servicos, error: e1 } = await db
          .from('services')
          .select('*')
          .eq('ativo', true)
          .order('id');

        if (e1) throw e1;

        // Busca agendamentos futuros (para marcar horários ocupados)
        const hoje = new Date().toISOString().split('T')[0];
        const { data: ags, error: e2 } = await db
          .from('appointments')
          .select('dia, hora, status')
          .gte('dia', hoje)
          .neq('status', 'cancelled');

        if (e2) throw e2;

        ocupados = (ags || []).map(a => a.dia + ' ' + a.hora);

        renderServicos(servicos || []);
        gerarDias();

        document.getElementById('loading-screen').classList.add('hidden');
        document.getElementById('form-screen').classList.remove('hidden');
      } catch (err) {
        document.getElementById('loading-screen').innerHTML =
          'Erro ao carregar. Verifique a configuração do Supabase.<br><br>' +
          '<small style="color:#666">' + err.message + '</small>';
      }
    }

    function renderServicos(servicos) {
      const container = document.getElementById('services');
      if (servicos.length === 0) {
        container.innerHTML = '<div class="empty-msg">Nenhum serviço disponível.</div>';
        return;
      }
      container.innerHTML = '';
      servicos.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'service';
        btn.innerHTML = s.nome + ' <span class="price">R$ ' + Number(s.preco).toFixed(0) + '</span>';
        btn.onclick = () => {
          document.querySelectorAll('.service').forEach(x => x.classList.remove('selected'));
          btn.classList.add('selected');
          selected.service = s.nome;
          selected.price = Number(s.preco);
        };
        container.appendChild(btn);
      });
    }

    function gerarDias() {
      const container = document.getElementById('days');
      container.innerHTML = '';
      const hoje = new Date();
      let mostrados = 0, offset = 0;
      while (mostrados < DIAS_A_MOSTRAR) {
        const data = new Date(hoje);
        data.setDate(hoje.getDate() + offset);
        offset++;
        if (!TRABALHA_DOMINGO && data.getDay() === 0) continue;
        const ano = data.getFullYear();
        const mes = String(data.getMonth() + 1).padStart(2, '0');
        const dia = String(data.getDate()).padStart(2, '0');
        const iso = ano + '-' + mes + '-' + dia;
        const btn = document.createElement('button');
        btn.className = 'day';
        btn.innerHTML =
          '<div class="weekday">' + SEMANA[data.getDay()] + '</div>' +
          '<div class="num">' + data.getDate() + '</div>' +
          '<div class="month">' + MESES[data.getMonth()] + '</div>';
        btn.onclick = () => selectDay(btn, iso, data);
        container.appendChild(btn);
        mostrados++;
      }
    }

    function selectDay(btn, iso, dataObj) {
      document.querySelectorAll('.day').forEach(d => d.classList.remove('selected'));
      btn.classList.add('selected');
      selected.day = iso;
      selected.time = null;

      const container = document.getElementById('times');
      container.innerHTML = '';
      const agora = new Date();
      const ehHoje = dataObj.toDateString() === agora.toDateString();

      for (let h = HORARIO_ABERTURA; h < HORARIO_FECHAMENTO; h++) {
        for (let m of [0, 30]) {
          const horaStr = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
          const chave = iso + ' ' + horaStr;
          const t = document.createElement('button');
          t.className = 'time';
          t.textContent = horaStr;
          const ocupado = ocupados.includes(chave);
          const jaPassou = ehHoje && (h < agora.getHours() ||
                            (h === agora.getHours() && m <= agora.getMinutes()));
          if (ocupado || jaPassou) {
            t.classList.add('taken');
          } else {
            t.onclick = () => {
              document.querySelectorAll('.time').forEach(x => x.classList.remove('selected'));
              t.classList.add('selected');
              selected.time = horaStr;
            };
          }
          container.appendChild(t);
        }
      }
    }

    function showError(msg) {
      const e = document.getElementById('error');
      e.textContent = msg;
      e.classList.remove('hidden');
    }

    async function submit() {
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();

      if (!selected.service) return showError('Escolha um serviço.');
      if (!selected.day)     return showError('Escolha um dia.');
      if (!selected.time)    return showError('Escolha um horário.');
      if (!name)             return showError('Digite seu nome.');
      if (!phone)            return showError('Digite seu WhatsApp.');

      document.getElementById('error').classList.add('hidden');
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Agendando...';

      // Salva no banco
      const { error } = await db.from('appointments').insert({
        cliente_nome: name,
        cliente_telefone: phone,
        servico_nome: selected.service,
        servico_preco: selected.price,
        dia: selected.day,
        hora: selected.time,
        status: 'confirmed'
      });

      if (error) {
        btn.disabled = false;
        btn.textContent = 'Confirmar agendamento';
        // Código 23505 = horário já ocupado (trava do banco)
        if (error.code === '23505') {
          showError('Ops! Esse horário acabou de ser reservado. Escolha outro.');
        } else {
          showError('Erro ao agendar. Tente novamente.');
        }
        return;
      }

      // Mostra tela de sucesso
      const [ano, mes, dia] = selected.day.split('-');
      document.getElementById('success-msg').textContent = name + ', seu horário está reservado!';
      document.getElementById('r-service').textContent = selected.service + ' (R$ ' + selected.price + ')';
      document.getElementById('r-name').textContent = name;
      document.getElementById('r-phone').textContent = phone;
      document.getElementById('r-datetime').textContent = dia + '/' + mes + '/' + ano + ' às ' + selected.time;

      document.getElementById('form-screen').classList.add('hidden');
      document.getElementById('success-screen').classList.remove('hidden');
    }

    iniciar();
  </script>
</body>
</html>
