<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Corte</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #fff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card { width: 100%; max-width: 440px; }
    .header { text-align: center; margin-bottom: 24px; }
    .header .logo { font-size: 40px; margin-bottom: 8px; }
    .header h1 { font-size: 22px; }
    .header p { color: #888; font-size: 14px; margin-top: 4px; }
    label {
      display: block;
      font-weight: 600;
      margin: 20px 0 10px;
      font-size: 14px;
    }
    .service {
      display: block;
      width: 100%;
      text-align: left;
      padding: 14px;
      margin-bottom: 8px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.15s;
    }
    .service:hover { border-color: #666; }
    .service.selected { border-color: #4ade80; background: #14351f; }
    .service .price { float: right; color: #4ade80; font-weight: 600; }

    .days {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
    }
    .day {
      flex: 0 0 auto;
      width: 64px;
      padding: 12px 6px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .day:hover { border-color: #666; }
    .day.selected { border-color: #4ade80; background: #14351f; }
    .day .weekday { font-size: 11px; color: #888; text-transform: uppercase; }
    .day.selected .weekday { color: #4ade80; }
    .day .num { font-size: 20px; font-weight: 700; margin-top: 2px; }
    .day .month { font-size: 10px; color: #666; }

    .times {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .time {
      padding: 12px 4px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      cursor: pointer;
      text-align: center;
      font-size: 14px;
      transition: all 0.15s;
    }
    .time:hover { border-color: #666; }
    .time.selected { border-color: #4ade80; background: #14351f; color: #4ade80; font-weight: 600; }
    .time.taken {
      background: #0f0f0f;
      color: #444;
      cursor: not-allowed;
      text-decoration: line-through;
      border-color: #222;
    }
    .empty-msg { color: #666; font-size: 14px; padding: 8px 0; }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 16px;
    }
    input:focus { outline: none; border-color: #666; }
    .btn {
      width: 100%;
      padding: 16px;
      margin-top: 24px;
      border-radius: 12px;
      border: none;
      background: #4ade80;
      color: #000;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.98); }
    .success { text-align: center; padding: 40px 20px; }
    .success .check { font-size: 56px; margin-bottom: 16px; }
    .success h2 { margin-bottom: 12px; }
    .success p { color: #aaa; line-height: 1.5; }
    .success .detail {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 16px;
      margin-top: 20px;
      text-align: left;
    }
    .success .detail div { margin: 6px 0; font-size: 14px; }
    .success .detail span { color: #888; }
    .btn-secondary {
      background: transparent;
      color: #4ade80;
      border: 1px solid #333;
      margin-top: 12px;
    }
    .error { color: #f87171; font-size: 14px; margin-top: 12px; text-align: center; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">

    <div id="form-screen">
      <div class="header">
        <div class="logo">💈</div>
        <h1>Barbearia do João</h1>
        <p>Escolha seu horário</p>
      </div>

      <label>1. Serviço</label>
      <div id="services">
        <button class="service" onclick="selectService(this, 'Corte', 40)">
          Corte <span class="price">R$ 40</span>
        </button>
        <button class="service" onclick="selectService(this, 'Barba', 30)">
          Barba <span class="price">R$ 30</span>
        </button>
        <button class="service" onclick="selectService(this, 'Corte + Barba', 60)">
          Corte + Barba <span class="price">R$ 60</span>
        </button>
      </div>

      <label>2. Dia</label>
      <div id="days" class="days"></div>

      <label>3. Horário</label>
      <div id="times" class="times">
        <div class="empty-msg">Escolha um dia primeiro.</div>
      </div>

      <label>4. Seus dados</label>
      <input id="name" type="text" placeholder="Seu nome" style="margin-bottom:8px">
      <input id="phone" type="tel" placeholder="(34) 99999-9999">

      <div id="error" class="error hidden"></div>

      <button class="btn" onclick="submit()">Confirmar agendamento</button>
    </div>

    <div id="success-screen" class="success hidden">
      <div class="check">✅</div>
      <h2>Agendamento confirmado!</h2>
      <p id="success-msg"></p>
      <div class="detail">
        <div><span>Serviço:</span> <b id="r-service"></b></div>
        <div><span>Nome:</span> <b id="r-name"></b></div>
        <div><span>WhatsApp:</span> <b id="r-phone"></b></div>
        <div><span>Quando:</span> <b id="r-datetime"></b></div>
      </div>
      <button class="btn btn-secondary" onclick="resetForm()">Fazer outro agendamento</button>
    </div>

  </div>

  <script>
    // ============================================
    // CONFIGURAÇÃO DO BARBEIRO
    // (No futuro, isto virá do banco de dados)
    // ============================================
    const HORARIO_ABERTURA = 9;    // abre 9h
    const HORARIO_FECHAMENTO = 19;  // fecha 19h
    const DIAS_A_MOSTRAR = 7;       // próximos 7 dias
    const TRABALHA_DOMINGO = false;

    // Horários já ocupados (simulação — no futuro virá do banco)
    // formato: "2026-08-05 14:00"
    const OCUPADOS = [];

    // ESTADO (o que o cliente escolheu)
    let selected = { service: null, price: null, day: null, time: null };

    const SEMANA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
    const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

    function gerarDias() {
      const container = document.getElementById('days');
      container.innerHTML = '';
      const hoje = new Date();

      let mostrados = 0;
      let offset = 0;
      while (mostrados < DIAS_A_MOSTRAR) {
        const data = new Date(hoje);
        data.setDate(hoje.getDate() + offset);
        offset++;

        if (!TRABALHA_DOMINGO && data.getDay() === 0) continue;

        const ano = data.getFullYear();
        const mes = String(data.getMonth() + 1).padStart(2, '0');
        const dia = String(data.getDate()).padStart(2, '0');
        const iso = ano + '-' + mes + '-' + dia;

        const btn = document.createElement('button');
        btn.className = 'day';
        btn.innerHTML =
          '<div class="weekday">' + SEMANA[data.getDay()] + '</div>' +
          '<div class="num">' + data.getDate() + '</div>' +
          '<div class="month">' + MESES[data.getMonth()] + '</div>';
        btn.onclick = () => selectDay(btn, iso, data);
        container.appendChild(btn);
        mostrados++;
      }
    }

    function selectDay(btn, iso, dataObj) {
      document.querySelectorAll('.day').forEach(d => d.classList.remove('selected'));
      btn.classList.add('selected');
      selected.day = iso;
      selected.time = null;

      const container = document.getElementById('times');
      container.innerHTML = '';

      const agora = new Date();
      const ehHoje = dataObj.toDateString() === agora.toDateString();

      for (let h = HORARIO_ABERTURA; h < HORARIO_FECHAMENTO; h++) {
        for (let m of [0, 30]) {
          const horaStr = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
          const chave = iso + ' ' + horaStr;

          const t = document.createElement('button');
          t.className = 'time';
          t.textContent = horaStr;

          const ocupado = OCUPADOS.includes(chave);
          const jaPassou = ehHoje && (h < agora.getHours() ||
                            (h === agora.getHours() && m <= agora.getMinutes()));

          if (ocupado || jaPassou) {
            t.classList.add('taken');
          } else {
            t.onclick = () => selectTime(t, horaStr);
          }
          container.appendChild(t);
        }
      }
    }

    function selectTime(btn, horaStr) {
      document.querySelectorAll('.time').forEach(t => t.classList.remove('selected'));
      btn.classList.add('selected');
      selected.time = horaStr;
    }

    function selectService(btn, name, price) {
      document.querySelectorAll('.service').forEach(s => s.classList.remove('selected'));
      btn.classList.add('selected');
      selected.service = name;
      selected.price = price;
    }

    function showError(msg) {
      const e = document.getElementById('error');
      e.textContent = msg;
      e.classList.remove('hidden');
    }

    function submit() {
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();

      if (!selected.service) return showError('Escolha um serviço.');
      if (!selected.day)     return showError('Escolha um dia.');
      if (!selected.time)    return showError('Escolha um horário.');
      if (!name)             return showError('Digite seu nome.');
      if (!phone)            return showError('Digite seu WhatsApp.');

      document.getElementById('error').classList.add('hidden');

      const [ano, mes, dia] = selected.day.split('-');
      const dataFormatada = dia + '/' + mes + '/' + ano + ' às ' + selected.time;

      document.getElementById('success-msg').textContent = name + ', seu horário está reservado!';
      document.getElementById('r-service').textContent = selected.service + ' (R$ ' + selected.price + ')';
      document.getElementById('r-name').textContent = name;
      document.getElementById('r-phone').textContent = phone;
      document.getElementById('r-datetime').textContent = dataFormatada;

      document.getElementById('form-screen').classList.add('hidden');
      document.getElementById('success-screen').classList.remove('hidden');
    }

    function resetForm() {
      document.getElementById('name').value = '';
      document.getElementById('phone').value = '';
      document.querySelectorAll('.service, .day, .time').forEach(el => el.classList.remove('selected'));
      document.getElementById('times').innerHTML = '<div class="empty-msg">Escolha um dia primeiro.</div>';
      selected = { service: null, price: null, day: null, time: null };
      document.getElementById('success-screen').classList.add('hidden');
      document.getElementById('form-screen').classList.remove('hidden');
    }

    gerarDias();
  </script>
</body>
</html>
